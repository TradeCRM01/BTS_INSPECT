name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'TradeCRM01/BTS_INSPECT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Require Cloudflare deploy secrets
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them at https://github.com/TradeCRM01/BTS_INSPECT/settings/secrets/actions"
            echo "Token needs Cloudflare Pages Edit on the account that owns project bts-inspect."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Vite Supabase env
        run: python3 .github/scripts/resolve-pages-vite-env.py

      - name: Build
        run: npm run build

      # wrangler pages deploy <dir> uploads <dir> as static assets and bundles
      # ./functions from the repo root (cwd), not from inside dist. Vite already
      # copies public/_routes.json into dist so only /assets/* hits the Function.
      - name: Confirm Pages Functions beside dist
        run: |
          test -f functions/assets/\[\[path\]\].ts
          test -f dist/_routes.json
          python3 - <<'PY'
          import json
          routes = json.load(open("dist/_routes.json"))
          assert routes.get("include") == ["/assets/*"], routes
          assert routes.get("exclude") == [], routes
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bts-inspect --branch main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
