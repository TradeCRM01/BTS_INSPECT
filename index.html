    <script>
      (function () {
        var KEY = 'grafter-theme';
        var allowDark = false;
        var followSystem = false;
        var root = document.documentElement;
        var mq = null;
        try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) {}

        function stored() {
          try {
            var v = window.localStorage.getItem(KEY);
            return v === 'light' || v === 'dark' || v === 'system' ? v : null;
          } catch (e) { return null; }
        }
        function forcedLight() {
          return /^\/p(\/|$)/.test(window.location.pathname);
        }
        function resolve(choice) {
          if (!allowDark) return 'light';
          if (choice === 'light' || choice === 'dark') return choice;
          if (!followSystem) return 'light';
          return mq && mq.matches ? 'dark' : 'light';
        }
        function apply(choice) {
          var theme = forcedLight() ? 'light' : resolve(choice);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          return theme;
        }

        var choice = stored() || 'system';
        apply(choice);

        function onSystemChange() {
          if (choice === 'system') apply('system');
        }
        if (mq) {
          if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
          else if (mq.addListener) mq.addListener(onSystemChange);
        }

        window.grafterTheme = {
          key: KEY,
          get: function () { return choice; },
          resolved: function () { return root.getAttribute('data-theme'); },
          set: function (next) {
            if (next !== 'light' && next !== 'dark' && next !== 'system') return;
            choice = next;
            try { window.localStorage.setItem(KEY, next); } catch (e) {}
            return apply(next);
          },
          reapply: function () { return apply(choice); }
        };
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Handle stale chunk errors from old service worker caches
      window.addEventListener('error', (e) => {
        const isModuleError = e.message?.includes('loading failed') ||
                            e.message?.includes('importing module script') ||
                            e.message?.includes('Failed to fetch dynamically imported module') ||
                            e.message?.includes('error loading dynamically imported module');

        if (isModuleError && !sessionStorage.getItem('chunk_reload')) {
          sessionStorage.setItem('chunk_reload', '1');
          // Clear caches then reload so fresh chunks are fetched
          if ('caches' in window) {
            caches.keys().then(names => Promise.all(names.map(n => caches.delete(n)))).then(() => {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }, true);
    </script>
