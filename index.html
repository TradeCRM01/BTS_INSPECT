  </head>
  <body>
    <div id="root"></div>
    <script>
      // Handle stale chunk errors from old service worker caches
      window.addEventListener('error', (e) => {
        const isModuleError = e.message?.includes('loading failed') ||
                            e.message?.includes('importing module script') ||
                            e.message?.includes('Failed to fetch dynamically imported module') ||
                            e.message?.includes('error loading dynamically imported module');

        if (isModuleError && !sessionStorage.getItem('chunk_reload')) {
          sessionStorage.setItem('chunk_reload', '1');
          // Clear caches then reload so fresh chunks are fetched
          if ('caches' in window) {
            caches.keys().then(names => Promise.all(names.map(n => caches.delete(n)))).then(() => {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
