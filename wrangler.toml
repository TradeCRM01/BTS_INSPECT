# Cloudflare Pages project `bts-inspect` → https://bts-inspect.pages.dev
# Auto-deploy: every merge to GitHub `main` runs `.github/workflows/deploy-pages.yml`
# (npm ci, npm run build with production VITE_SUPABASE_*, then
# wrangler pages deploy dist --project-name bts-inspect --branch main).
name = "bts-inspect"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"
